name: Build DLS Ultimate AI Web
on:
  push:
    branches: [ "work/finalize-dls-coach-ai" ]
    paths: [ "web/**" ]
  pull_request:
    paths: [ "web/**" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dls-ultimate-ai-web-dist
          path: web/dist
          retention-days: 14
