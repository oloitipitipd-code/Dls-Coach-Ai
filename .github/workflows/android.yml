name: Build DLS Coach AI APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feature/real-account-integration-audit" ]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Run Android lint (retry transient dependency failures)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Android lint attempt ${attempt}/3"
            if [ "$attempt" -eq 1 ]; then
              gradle lintDebug
            else
              gradle lintDebug --refresh-dependencies
            fi
            status=$?
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DLS-Coach-AI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
